services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=4000
    ports:
      - "4000:4000"

  frontend:
    image: node:20
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_BASE_URL=http://api:4000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  node_modules:
