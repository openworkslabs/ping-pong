<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <radialGradient id="ball" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>
  
  <!-- Table (perspective) -->
  <polygon points="50,200 350,200 300,100 100,100" fill="url(#table)" opacity="0.9"/>
  <line x1="100" y1="100" x2="50" y2="200" stroke="#60a5fa" stroke-width="2"/>
  <line x1="300" y1="100" x2="350" y2="200" stroke="#60a5fa" stroke-width="2"/>
  <line x1="100" y1="100" x2="300" y2="100" stroke="#60a5fa" stroke-width="2"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Net -->
  <line x1="200" y1="100" x2="200" y2="200" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Paddle -->
  <g transform="translate(280, 160)">
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#paddle)" filter="url(#glow)"/>
    <rect x="-8" y="20" width="16" height="30" rx="4" fill="#92400e"/>
  </g>
  
  <!-- Ball -->
  <circle cx="160" cy="130" r="15" fill="url(#ball)" filter="url(#glow)"/>
  
  <!-- Motion lines -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.6">
    <line x1="130" y1="135" x2="110" y2="140"/>
    <line x1="130" y1="130" x2="105" y2="130"/>
    <line x1="130" y1="125" x2="110" y2="120"/>
  </g>
</svg>

