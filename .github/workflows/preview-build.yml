name: PR Preview Build

on:
  pull_request:
    branches: [main]

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build:site

      - name: Build ping-pong game
        run: npm run build:ping-pong

      - name: Build golf game
        run: npm run build:golf

      - name: Upload site dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: packages/site/dist

      - name: Upload ping-pong dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ping-pong-dist
          path: packages/games/ping-pong/frontend/dist

      - name: Upload golf dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: golf-dist
          path: packages/games/golf/frontend/dist
